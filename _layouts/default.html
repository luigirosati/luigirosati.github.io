<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="/assets/img/thumb.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Luigi Rosati</a></h1>
    {% unless page.url == '/' %}
    <nav>
      <a href="/">home</a>
      <a href="/research"{% if page.url contains 'research' %} class="active"{% endif %}>research</a>
      <a href="/teaching"{% if page.url contains 'teaching' %} class="active"{% endif %}>teaching</a>
      <a href="/music"{% if page.url contains 'music' %} class="active"{% endif %}>music</a>
      <a href="/cv"{% if page.url contains 'cv' %} class="active"{% endif %}>cv</a>

    </nav>
    {% endunless %}
    {% if page.url contains 'research' %}
    <div class="page-subnav">
      <a href="https://fismed.uniroma2.it/staff/luigi-rosati/" target="_blank" rel="noopener">lab</a>
      <a href="https://scholar.google.com/citations?user=EQeGSKMAAAAJ&hl=it&oi=ao" target="_blank" rel="noopener">scholar</a>
      <a href="https://github.com/luigirosati" target="_blank" rel="noopener">github</a>
      <a href="https://orcid.org/0009-0000-7585-4105" target="_blank" rel="noopener">orcid</a>
    </div>
    {% endif %}
    {% if page.project_links %}
    <div class="page-subnav">
      {% for link in page.project_links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <main>
    {{ content }}
  </main>

  <footer></footer>
</body>
</html>
